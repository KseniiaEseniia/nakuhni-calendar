<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>На Кухні — Портфоліо</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #CEE7F3;
    --dark: #181717;
    --brown: #3a3535;
    --red: #A91B18;
    --light: #b8d8e8;
    --linen: #F8FAED;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--cream);
    color: var(--dark);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--linen);
    border-bottom: 1px solid var(--light);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--dark);
    text-decoration: none;
  }
  .nav-logo span { color: var(--red); font-style: italic; }
  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }
  .nav-links a {
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brown);
    transition: color 0.2s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--red); }
  @media (max-width: 500px) {
    .nav-links { gap: 14px; }
    .nav-links a { font-size: 0.7rem; }
  }

  /* HERO */
  .page-hero {
    background: var(--dark);
    padding: 72px 24px 56px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .page-hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #A91B18, #CEE7F3, #181717);
  }
  .page-hero-tag {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.5;
    margin-bottom: 16px;
  }
  .page-hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 400;
    color: var(--linen);
    margin-bottom: 12px;
  }
  .page-hero-sub {
    font-size: 0.88rem;
    color: var(--cream);
    opacity: 0.55;
    letter-spacing: 0.05em;
  }

  /* TABS */
  .tabs {
    background: var(--linen);
    border-bottom: 1px solid var(--light);
    display: flex;
    justify-content: center;
    gap: 0;
    position: sticky;
    top: 56px;
    z-index: 40;
  }
  .tab-btn {
    padding: 16px 28px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Jost', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brown);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--red);
    border-bottom-color: var(--red);
  }
  .tab-btn:hover { color: var(--red); }

  /* GALLERY */
  .gallery-section {
    padding: 48px 24px 72px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 600px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  }

  .gallery-item {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 1;
    background: var(--light);
    cursor: pointer;
  }
  .gallery-item.wide {
    grid-column: span 2;
    aspect-ratio: 2/1;
  }
  .gallery-item.tall {
    grid-row: span 2;
    aspect-ratio: 1/2;
  }
  .gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .gallery-item:hover img { transform: scale(1.04); }
  .gallery-item-overlay {
    position: absolute;
    inset: 0;
    background: rgba(24,23,23,0);
    transition: background 0.3s;
    display: flex;
    align-items: flex-end;
    padding: 16px;
  }
  .gallery-item:hover .gallery-item-overlay {
    background: rgba(24,23,23,0.3);
  }
  .gallery-item-label {
    font-size: 0.78rem;
    color: white;
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .gallery-item:hover .gallery-item-label { opacity: 1; }

  /* Placeholder for missing photos */
  .gallery-placeholder {
    width: 100%;
    height: 100%;
    background: var(--light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    color: var(--brown);
    opacity: 0.4;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 16px;
  }

  /* LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(24,23,23,0.95);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: white;
    font-size: 1.8rem;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
    z-index: 2;
  }
  .lightbox-close:hover { opacity: 1; }
  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.12);
    border: none;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 2;
  }
  .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
  .lightbox-nav.prev { left: 16px; }
  .lightbox-nav.next { right: 16px; }
  .lightbox-counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    opacity: 0.5;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
  }
  @media (max-width: 500px) {
    .lightbox-nav { width: 38px; height: 38px; font-size: 1.2rem; }
    .lightbox-nav.prev { left: 6px; }
    .lightbox-nav.next { right: 6px; }
  }

  /* ADD PHOTO HINT */
  .add-hint {
    text-align: center;
    padding: 40px 0 0;
    font-size: 0.8rem;
    color: var(--brown);
    opacity: 0.45;
    letter-spacing: 0.05em;
  }

  /* CTA */
  .cta-section {
    padding: 72px 24px;
    background: var(--red);
    text-align: center;
  }
  .cta-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 400;
    color: var(--linen);
    margin-bottom: 12px;
  }
  .cta-sub {
    font-size: 0.88rem;
    color: var(--linen);
    opacity: 0.75;
    margin-bottom: 32px;
  }
  .cta-btn {
    display: inline-block;
    padding: 14px 36px;
    border-radius: 8px;
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--linen);
    color: var(--red);
    font-weight: 500;
    transition: all 0.2s;
  }
  .cta-btn:hover { transform: translateY(-2px); opacity: 0.9; }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.75rem;
    color: var(--brown);
    opacity: 0.5;
    letter-spacing: 0.08em;
    background: var(--linen);
  }
</style>
</head>
<body>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-nav prev" onclick="navigateLightbox(-1)">&#8592;</button>
  <img id="lightboxImg" src="" alt="" style="user-select:none;">
  <button class="lightbox-nav next" onclick="navigateLightbox(1)">&#8594;</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<nav>
  <a href="index.html" class="nav-logo">на <span>кухні</span></a>
  <ul class="nav-links">
    <li><a href="about.html">Про мене</a></li>
    <li><a href="portfolio.html" class="active">Портфоліо</a></li>
    <li><a href="index.html">Календар</a></li>
  </ul>
</nav>

<div class="page-hero">
  <div class="page-hero-tag">Моя робота</div>
  <h1 class="page-hero-title">Портфоліо</h1>
  <p class="page-hero-sub">Страви, ретрити, події — все з турботою</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('all', this)">Все</button>
  <button class="tab-btn" onclick="switchTab('food', this)">Страви</button>
  <button class="tab-btn" onclick="switchTab('retreats', this)">Ретрити</button>
</div>

<div class="gallery-section">
  <div class="tab-content active" id="tab-all"></div>
  <div class="tab-content" id="tab-food"></div>
  <div class="tab-content" id="tab-retreats"></div>
</div>

<section class="cta-section">
  <div class="cta-title">Хочеш таку кухню на своїй події?</div>
  <div class="cta-sub">Перевір вільні дати і напиши мені</div>
  <a href="index.html" class="cta-btn">Переглянути календар</a>
</section>

<footer>на кухні · Ксенія · @nakuhni · 2026</footer>

<script>
  // =====================
  // ФОТО ПОРТФОЛІО
  // Додай новий рядок щоб додати фото:
  // { file: "назва_файлу.jpg", label: "Підпис", category: "food" | "retreats", size: "normal" | "wide" | "tall" }
  // size необов'язковий — за замовчуванням "normal" (квадрат)
  // "wide" — горизонтальний прямокутник, "tall" — вертикальний
  // =====================
  const photos = [
    { file: "IMG_7961.jpg",  label: "Ретрит",  category: "retreats", size: "wide" },
    { file: "IMG_8103.jpg",  label: "Кухня",   category: "food" },
    { file: "IMG_8298.jpg",  label: "Страва",  category: "food" },
    { file: "IMG_9912.jpg",  label: "Ретрит",  category: "retreats", size: "tall" },
    { file: "F2E892BC-11C9-4BC1-A105-B7896F0BE7F0_1_102_o.jpeg", label: "Вечеря", category: "retreats" },
    { file: "513573BC-AFA4-4BDA-9F51-DD57AD50B83D_1_102_o.jpeg", label: "Святкова вечеря", category: "retreats", size: "tall" },
    { file: "57628CFE-B4D3-4411-BF9C-DFF581C4C50F_1_105_c.jpeg", label: "Сирники", category: "food", size: "tall" },
    { file: "89FE9990-9177-44D3-A631-6DEC12476568_1_105_c.jpeg", label: "Жіночій ретрит", category: "retreats" },
    { file: "C003DB01-F19D-4940-99F5-6CFC38974FE3_1_102_o.jpeg", label: "Шакшука", category: "food" },
    { file: "EB06F684-142B-4DCD-AF21-CAF48CB07FC9_1_102_a.jpeg", label: "Борщ з чорносливом", category: "food" },
    { file: "IMG_5769.jpg", label: "Закуски", category: "retreats" }
  ];

  const BASE = "https://raw.githubusercontent.com/KseniiaEseniia/nakuhni-calendar/main/";

  let currentFilter = 'all';
  let currentIndex = 0;
  let currentList = [];

  function getFiltered(filter) {
    return filter === 'all' ? photos : photos.filter(p => p.category === filter);
  }

  function buildGallery(containerId, filter) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const filtered = getFiltered(filter);
    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center;opacity:0.4;padding:40px 0;font-size:0.85rem;">Фото незабаром</p>';
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'gallery-grid';
    filtered.forEach((photo, i) => {
      const size = photo.size || 'normal';
      const item = document.createElement('div');
      item.className = 'gallery-item' + (size !== 'normal' ? ' ' + size : '');
      item.innerHTML = `
        <img src="${BASE}${photo.file}" alt="${photo.label}" loading="lazy">
        <div class="gallery-item-overlay"><span class="gallery-item-label">${photo.label}</span></div>
      `;
      item.addEventListener('click', () => openLightbox(filter, i));
      grid.appendChild(item);
    });
    container.appendChild(grid);
  }

  buildGallery('tab-all', 'all');
  buildGallery('tab-food', 'food');
  buildGallery('tab-retreats', 'retreats');

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
    currentFilter = name;
  }

  // LIGHTBOX
  function openLightbox(filter, index) {
    currentFilter = filter;
    currentList = getFiltered(filter);
    currentIndex = index;
    showLightboxPhoto();
    document.getElementById('lightbox').classList.add('active');
  }

  function showLightboxPhoto() {
    const photo = currentList[currentIndex];
    const img = document.getElementById('lightboxImg');
    img.style.opacity = '0';
    setTimeout(() => {
      img.src = BASE + photo.file;
      img.alt = photo.label;
      img.style.opacity = '1';
    }, 120);
    document.getElementById('lightboxCounter').textContent = `${currentIndex + 1} / ${currentList.length}`;
  }

  function navigateLightbox(dir) {
    currentIndex = (currentIndex + dir + currentList.length) % currentList.length;
    showLightboxPhoto();
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }

  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navigateLightbox(1);
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
  });

  // Swipe support
  let touchStartX = 0;
  document.getElementById('lightbox').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('lightbox').addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) navigateLightbox(diff > 0 ? 1 : -1);
  }, { passive: true });

  // Click outside image to close
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox') || e.target === document.getElementById('lightboxImg')) {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    }
  });

  // Smooth transition for image
  document.getElementById('lightboxImg').style.transition = 'opacity 0.15s ease';
</script>
</body>
</html>
